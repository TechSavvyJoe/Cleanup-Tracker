services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: cleanup-tracker-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: cleanup-tracker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - cleanup-tracker-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Cleanup Tracker Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cleanup-tracker-app
    restart: always
    ports:
      - "5051:5051"
    environment:
      - NODE_ENV=production
      - PORT=5051
      - MONGO_URI=mongodb://mongodb:27017/cleanup-tracker
      - JWT_SECRET=mdI4SE/mK5zt91zfRQ5gVSkVt/onlBoJ3Z9YDJA7oT4=
      - JWT_ACCESS_SECRET=PK4ZpXlHCcDbBYiqMw3IT6MnWzM6Jm0VJ2diNJtRZSc=
      - JWT_REFRESH_SECRET=IpXS636KPmb3+z/X5f6a2u+t5rggE8by3u28XdP96Cg=
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
      - FRONTEND_URL=http://localhost:5051,http://cleanup-tracker.local
      - INVENTORY_CSV_URL=https://docs.google.com/spreadsheets/d/e/2PACX-1vSTW7Nwrbbl3Lp7R3RlKfSx-cd1tAffBzTINNOrCnaU1wp3kA7av63Y5Af8Jn4ATMDB09XcIAO_wodU/pub?output=csv
      - RATE_LIMIT_MAX=100
      - AUTH_RATE_LIMIT_MAX=5
      - UPLOAD_LIMIT=10mb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cleanup-tracker-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5051/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  cleanup-tracker-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
