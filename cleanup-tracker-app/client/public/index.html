<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Cleanup Tracker App" />
    <title>Cleanup Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @supports (-webkit-touch-callout: none) {
      input, select, textarea { font-size: 16px !important; }
    }
    html {
      -webkit-text-size-adjust: 100%;
      font-size: 14px;
    }
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      max-width: 100vw;
    }
    #root {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    * { box-sizing: border-box; }
    @media (max-width: 768px) {
      .p-8, .p-10, [class*="p-8"], [class*="p-10"] { padding: 1rem !important; }
      .text-4xl { font-size: 1.5rem !important; }
      .text-2xl { font-size: 1.25rem !important; }
      .py-4, .py-5 { padding-top: 0.75rem !important; padding-bottom: 0.75rem !important; }
      button { padding: 0.625rem 1rem !important; font-size: 0.875rem !important; }
    }
  </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
