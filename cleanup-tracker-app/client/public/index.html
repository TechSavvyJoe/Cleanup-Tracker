<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Cleanup Tracker App" />
    <title>Cleanup Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @supports (-webkit-touch-callout: none) {
      input, select, textarea { font-size: 16px !important; }
    }
    html {
      -webkit-text-size-adjust: 100%;
      font-size: 12px !important;
    }
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      max-width: 100vw;
    }
    #root {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    * { box-sizing: border-box; }
    
    /* HIDE THE GIANT CIRCLE/LOGO */
    svg, .w-24, .h-24, .w-16, .h-16, .w-14, .h-14 {
      max-width: 48px !important;
      max-height: 48px !important;
    }
    
    /* Force all text to be smaller */
    h1, .text-5xl { font-size: 1.25rem !important; }
    h2, .text-2xl { font-size: 1rem !important; }
    .text-4xl { font-size: 1.25rem !important; }
    .text-xl { font-size: 0.875rem !important; }
    .text-lg { font-size: 0.875rem !important; }
    
    /* Reduce all padding and margins */
    .p-8, .p-10, .py-8, .py-10, .px-8, .px-10,
    [class*="p-8"], [class*="p-10"] { 
      padding: 0.75rem !important; 
    }
    .py-5, .py-6 { 
      padding-top: 0.5rem !important; 
      padding-bottom: 0.5rem !important; 
    }
    .mb-8, .mb-6, .my-8 { 
      margin-bottom: 0.75rem !important; 
    }
    .gap-8, .gap-12 { 
      gap: 0.75rem !important; 
    }
    
    /* Make buttons smaller */
    button {
      padding: 0.5rem 0.75rem !important;
      font-size: 0.75rem !important;
      min-height: 36px !important;
    }
    
    /* Reduce border radius */
    .rounded-3xl, .rounded-2xl {
      border-radius: 0.75rem !important;
    }
  </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
